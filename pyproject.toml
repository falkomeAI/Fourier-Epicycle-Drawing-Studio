[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "falkourier"
version = "1.0.0"
description = "High-precision Fourier Series Epicycle Drawing Engine & Studio by @falkomeai"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [
    { name = "falkomeai", email = "falkomeai@users.noreply.github.com" }
]
maintainers = [
    { name = "falkomeai", email = "falkomeai@users.noreply.github.com" }
]
keywords = [
    "fourier",
    "fourier-series",
    "epicycles",
    "drawing",
    "math-art",
    "animation",
    "fft",
    "dft",
    "graphics",
    "falkomeai",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "Pillow>=9.0",
    "opencv-python-headless>=4.8",
    "streamlit>=1.28",
    "imageio-ffmpeg>=0.4.8",
]

[project.optional-dependencies]
ai = [
    "rembg>=2.0",
    "ultralytics>=8.3.0",
]
dev = [
    "build",
    "twine",
    "wheel",
]

[project.urls]
Homepage = "https://github.com/falkomeAI/Fourier-Epicycle-Drawing-Studio"
Documentation = "https://falkomeAI.github.io/Fourier-Epicycle-Drawing-Studio/"
"Live Demo" = "https://fourier-studio.streamlit.app/"
Repository = "https://github.com/falkomeAI/Fourier-Epicycle-Drawing-Studio.git"
"Bug Tracker" = "https://github.com/falkomeAI/Fourier-Epicycle-Drawing-Studio/issues"
Creator = "https://instagram.com/falkomeai"

[project.scripts]
falkourier = "falkourier.cli:main"
falkourier-studio = "falkourier.cli:studio_main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["falkourier*", "fourier_drawing*"]

[tool.setuptools.package-data]
falkourier = ["*.json"]
